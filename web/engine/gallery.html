<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card gallery</title>
<style>
    :root { color-scheme: light dark; --page: #dcd6e3; --panel: #eeeaf2; --line: #c5bdd0; --text: #1b1b1f; --muted: #5d5a66; --accent: #5b3fd6; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #24252b; --panel: #2e2f37; --line: #454650; --text: #ececf1; --muted: #a4a3ae; --accent: #a795ff; --on-accent: #17171b; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr); background: var(--page); color: var(--text); font: 14px system-ui, sans-serif; }
    aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 16px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 18px; }
    label, fieldset { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; border: 0; font-weight: 600; }
    legend { padding: 0; margin-bottom: 4px; font-weight: 600; }
    label.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; }
    input[type=search], select { font: inherit; font-weight: 400; width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: inherit; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chips button, .reset { font: inherit; padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: inherit; cursor: pointer; }
    .chips button small { color: var(--muted); }
    .chips button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .chips button[aria-pressed=true] small { color: inherit; }
    button:disabled { opacity: .45; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    main { padding: 16px 24px 32px; min-width: 0; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    #grid { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); gap: 28px 24px; }
    figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .slot { position: relative; aspect-ratio: 630 / 880; border-radius: 12px; background: var(--panel); }
    .slot .poster { position: absolute; inset: 0; width: 100%; height: 100%; }
    .slot .poster[hidden] { display: none; }
    pokemon-card { display: block; width: 100%; }
    figcaption button { all: unset; display: block; width: 100%; cursor: pointer; text-align: center; position: relative; z-index: 2; }
    figcaption button:focus-visible { outline: 2px solid var(--accent); }
    figcaption strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    figcaption span { color: var(--muted); font-size: 12px; }
    .failed { display: grid; place-items: center; border: 1px dashed var(--line); color: var(--muted); }
    #empty { padding: 48px 0; text-align: center; color: var(--muted); }
    dialog { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--page); color: inherit; overflow: hidden; }
    dialog[open] { display: grid; place-items: center; }
    /* As tall as the screen allows, unless the width runs out first: a phone held upright. */
    dialog pokemon-card { height: min(84vh, calc((100vw - 32px) * 880 / 630)); width: auto; }
    dialog p { position: fixed; left: 16px; top: 8px; margin: 0; z-index: 3; }
    dialog button { position: fixed; right: 16px; top: 12px; z-index: 3; font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; cursor: pointer; }
    @media (max-width: 760px) {
        body { display: block; }
        aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
        main { padding: 16px; }
        #grid { gap: 20px 12px; }
    }
</style>
<link rel="modulepreload" href="src/pokemon-card.js">
<link rel="modulepreload" href="src/engine.js">
<link rel="modulepreload" href="src/effects.js">
<link rel="modulepreload" href="src/bloom.js">
<link rel="modulepreload" href="src/touch.js">
<script type="module" src="gallery.js"></script>
</head>
<body>
<aside>
    <h1>Gallery</h1>
    <label>Search<input id="search" type="search" placeholder="Name or id"></label>
    <label>Extension<select id="extension"></select></label>
    <label>Evolution family<select id="family"></select></label>
    <fieldset><legend>Rarity</legend><div id="rarity" class="chips"></div></fieldset>
    <fieldset><legend>Type</legend><div id="type" class="chips"></div></fieldset>
    <fieldset><legend>Category</legend><div id="kind" class="chips"></div></fieldset>
    <label>Language<select id="language"></select></label>
    <label class="check"><input id="gold" type="checkbox">Gold frame, when the card has one</label>
    <label>Cards per row<select id="columns"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>
    <button id="reset" class="reset" type="button">Clear all</button>
</aside>
<main>
    <header>
        <output id="count" aria-live="polite">Loading…</output>
    </header>
    <div id="grid"></div>
    <div id="end"></div>
    <p id="empty" hidden>No card matches these filters.</p>
</main>
<dialog id="viewer" aria-label="Card viewer"><p id="viewer-title"></p><button id="close" type="button">Close</button></dialog>
</body>
</html>
