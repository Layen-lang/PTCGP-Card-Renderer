<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render diagnostics</title>
<style>
    :root { color-scheme: light dark; --page: #dcd6e3; --panel: #eeeaf2; --line: #c5bdd0; --text: #1b1b1f; --muted: #5d5a66; --accent: #5b3fd6; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #24252b; --panel: #2e2f37; --line: #454650; --text: #ececf1; --muted: #a4a3ae; --accent: #a795ff; --on-accent: #17171b; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--page); color: var(--text); font: 15px system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    h1 { margin: 0; font-size: 18px; align-self: stretch; }
    p { margin: 0; align-self: stretch; color: var(--muted); }
    #stage { width: min(100%, 420px); display: grid; place-items: center; min-height: 300px; }
    #stage pokemon-card { height: min(60vh, calc((100vw - 32px) * 880 / 630)); width: auto; }
    #status { align-self: stretch; font-variant-numeric: tabular-nums; }
    progress { width: 100%; height: 8px; accent-color: var(--accent); }
    textarea { width: 100%; min-height: 260px; font: 12px ui-monospace, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); cursor: pointer; width: 100%; }
    button:disabled { opacity: .5; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<script type="module" src="diag.js"></script>
</head>
<body>
<h1>Render diagnostics</h1>
<p>Leave the device alone during the tests (about 1 minute 30), screen on. Then press “Copy the report” and paste the text where you were asked.</p>
<output id="status">Preparing…</output>
<progress id="progress" max="1" value="0"></progress>
<div id="stage"></div>
<button id="copy" type="button" disabled>Copy the report</button>
<textarea id="report" readonly aria-label="Rapport"></textarea>
</body>
</html>
